<!DOCTYPE html>
<html>
<head>
    <style>
        /* 导航栏容器 */
        .navbar {

            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            color: white;
            padding: 16px;
        }

        /* 品牌标识 */
        .brand {

            font-size: 24px;
            font-weight: bold;
        }

        /* 导航链接 */
        .nav-links {

            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links li {

            margin-left: 20px;
        }

        .nav-links a {

            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {

            color: #007BFF;
        }

        /* 移动端菜单按钮 */
        .menu-toggle {

            display: none;
            cursor: pointer;
        }

        .menu-toggle .bar {

            width: 25px;
            height: 3px;
            background-color: white;
            margin: 5px 0;
            transition: all 0.3s ease;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {

            .nav-links {

                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                background-color: #333;
                width: 100%;
            }

            .nav-links.active {

                display: flex;
            }

            .nav-links li {

                margin: 10px 0;
                text-align: center;
            }

            .menu-toggle {

                display: block;
            }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="brand">Logo</div>
    <ul class="nav-links">
        <li><a href="#">首页</a></li>
        <li><a href="#">产品</a></li>
        <li><a href="#">服务</a></li>
        <li><a href="#">关于我们</a></li>
        <li><a href="#">联系我们</a></li>
    </ul>
    <div class="menu-toggle">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>
</nav>

<script>
    // 移动端菜单切换
    const menuToggle = document.querySelector('.menu-toggle');
    const navLinks = document.querySelector('.nav-links');

    menuToggle.addEventListener('click', () => {

        navLinks.classList.toggle('active');
        menuToggle.classList.toggle('active');

        // 切换图标
        const bars = menuToggle.querySelectorAll('.bar');
        if (navLinks.classList.contains('active')) {

            bars[0].style.transform = 'rotate(-45deg) translate(-5px, 6px)';
            bars[1].style.opacity = '0';
            bars[2].style.transform = 'rotate(45deg) translate(-5px, -6px)';
        } else {

            bars[0].style.transform = 'none';
            bars[1].style.opacity = '1';
            bars[2].style.transform = 'none';
        }
    });
</script>
</body>
</html>
